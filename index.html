<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FM100 Prediction</title><script src="https://telegram.org/js/telegram-web-app.js?64"></script><style>body{margin:0;font-family:system-ui;background:#f4f5f7;color:#171717}.wrap{max-width:680px;margin:auto;padding:16px}.hero{background:#111827;color:#fff;border-radius:24px;padding:22px}.muted{color:#9ca3af}.tabs{display:flex;gap:8px;margin:14px 0;overflow:auto}.tab{border:0;padding:12px 15px;border-radius:13px;background:#fff;font-weight:800}.tab.active{background:#111827;color:#fff}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:16px;margin:12px 0}.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}.score{display:flex;gap:6px;align-items:center}.score input{width:45px;height:42px;text-align:center;font-size:19px;font-weight:800;border:1px solid #ddd;border-radius:11px}.save{width:100%;border:0;background:#111827;color:#fff;border-radius:13px;padding:13px;font-weight:800;margin-top:13px}.msg{margin-top:10px;padding:10px;border-radius:11px;background:#ecfdf5;color:#047857;display:none}.section{display:none}.section.active{display:block}table{width:100%;border-collapse:collapse}td{padding:10px 4px;border-bottom:1px solid #eee}.badge{display:inline-block;background:#eef0f3;padding:5px 8px;border-radius:99px;font-size:12px;font-weight:800}</style></head><body><main class="wrap"><div class="hero"><div class="muted">FOOTBALLMAJAZI100</div><h1>پیش‌بینی FM100 ⚽</h1><div id="hello">در حال ورود...</div><strong id="points">۰ امتیاز</strong></div><div class="tabs"><button class="tab active" data-s="matches">⚽ بازی‌ها</button><button class="tab" data-s="ranking">🏆 جدول</button><button class="tab" data-s="history">📜 من</button></div><section id="matches" class="section active"><div id="matchList">در حال دریافت بازی‌ها...</div></section><section id="ranking" class="section"><div class="card"><h3>🏆 جدول پیش‌بینی</h3><table id="rankTable"></table></div></section><section id="history" class="section"><div class="card"><h3>📜 پیش‌بینی‌های من</h3><div id="historyList">در حال دریافت...</div></div></section></main><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const headers={'x-telegram-init-data':tg?.initData||''};
const fa=n=>new Intl.NumberFormat('fa-IR').format(n);const api=async(u,o={})=>{const r=await fetch(u,{...o,headers:{...headers,'Content-Type':'application/json',...(o.headers||{})}});const j=await r.json();if(!r.ok)throw new Error(j.error||'خطا');return j};
async function load(){try{const me=await api('/api/me');document.getElementById('hello').textContent=`سلام ${me.user?.first_name||'دوست FM100'} 👋`;document.getElementById('points').textContent=`${fa(me.points||0)} امتیاز · رتبه ${fa(me.rank||'-')}`;const m=await api('/api/matches');renderMatches(m.matches||[]);const r=await api('/api/leaderboard');renderRank(r.users||[]);const h=await api('/api/my-predictions');renderHistory(h.predictions||[])}catch(e){document.getElementById('hello').textContent=e.message}}
function renderMatches(ms){const box=document.getElementById('matchList');if(!ms.length){box.innerHTML='<div class="card">هنوز بازی‌ای اضافه نشده.</div>';return}box.innerHTML=ms.map(m=>`<div class="card"><div class="match"><b>${esc(m.home_team)}</b><div><span class="badge">${new Date(m.kickoff_at).toLocaleString('fa-IR')}</span><div class="score"><input id="h-${m.id}" type="number" min="0" max="20"><b>−</b><input id="a-${m.id}" type="number" min="0" max="20"></div></div><b>${esc(m.away_team)}</b></div><button class="save" onclick="savePred('${m.id}')">ثبت پیش‌بینی</button><div id="msg-${m.id}" class="msg"></div></div>`).join('')}
async function savePred(id){const h=Number(document.getElementById('h-'+id).value),a=Number(document.getElementById('a-'+id).value),msg=document.getElementById('msg-'+id);try{await api('/api/predictions',{method:'POST',body:JSON.stringify({match_id:id,home_score:h,away_score:a})});msg.style.display='block';msg.textContent=`✅ ${h} - ${a} ثبت شد`;}catch(e){msg.style.display='block';msg.style.background='#fff1f2';msg.style.color='#be123c';msg.textContent='⚠️ '+e.message}}
function renderRank(us){document.getElementById('rankTable').innerHTML=us.map((u,i)=>`<tr><td>${['🥇','🥈','🥉'][i]||fa(i+1)}</td><td>${esc(u.first_name||u.username||'کاربر')}</td><td><b>${fa(u.points||0)}</b></td></tr>`).join('')}
function renderHistory(ps){document.getElementById('historyList').innerHTML=ps.length?ps.map(p=>`<p>${esc(p.matches?.home_team||'')} ${p.home_score} - ${p.away_score} ${esc(p.matches?.away_team||'')} <b>+${fa(p.points||0)}</b></p>`).join(''):'هنوز پیش‌بینی‌ای ثبت نکردی.'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id===b.dataset.s))});load();
</script></body></html>
